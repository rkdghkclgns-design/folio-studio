name: Verify and deploy Folio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Java for the official EPUB checker
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify app and companion
        run: |
          npm test
          python3 -m unittest discover -s companion -p 'test_*.py'
      - name: Validate generated EPUBs with pinned EPUBCheck
        run: npm run validate:epub
      - name: Retain EPUBCheck reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epubcheck-reports
          path: .qa/epubcheck/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package static app and matching Windows companion
        env:
          FOLIO_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          node scripts/package-static.mjs "$RUNNER_TEMP/folio-pages"
          python3 companion/package.py \
            --site-origin "$FOLIO_PAGES_ORIGIN" \
            --output "$RUNNER_TEMP/folio-pages/downloads/folio-computer-companion.zip"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/folio-pages

  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
